[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.railway"

[deploy]
startCommand = "/bin/sh -c 'cd backend && npm start & cd intelligence && uvicorn app.main:app --host 0.0.0.0 --port 8000'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 3
