services:
  mysql:
    image: mysql:8.4
    container_name: medripple-mysql
    environment:
      MYSQL_DATABASE: medripple
      MYSQL_USER: medripple
      MYSQL_PASSWORD: medripple_dev_only
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_dev_only"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:

